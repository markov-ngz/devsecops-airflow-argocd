apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:

      # Addresses run-as-non-root for the pod layer
      securityContext:
        runAsUser: 999        # Standard uid for the official Postgres image user
        runAsGroup: 999       # Standard gid for the official Postgres image group
        fsGroup: 999          # Ensures the mounted storage volume has correct group ownership
        runAsNonRoot: true

      containers:
        - name: postgres
          image: markreduce/airflow-database-backend:0.1.0
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
          resources:
            requests:
              cpu: 251m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: tmp-dir
              mountPath: /tmp
            - name: run-dir
              mountPath: /var/run/postgresql
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: POSTGRES_DB
              value: "POLARIS"
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding UTF8 --data-checksums"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - postgres
                topologyKey: kubernetes.io/hostname

      volumes:
        - name: tmp-dir
          emptyDir: {}
        - name: run-dir
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi