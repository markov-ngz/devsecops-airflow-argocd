name: Validate infrastructure code

on:
  pull_request:
    branches:
      - develop
    paths:
      - kubernetes/**

jobs:
  lint-kubernetes-manifests:
    name: Lint Kubernetes manifests
    runs-on: ubuntu-latest
    env:
      KUBE_LINTER_VERSION_FILE_PATH: tools/kube-linter/.kube-linter-version
      SCRIPT_KUBE_LINTER_SUMMARY: tools/kube-linter/kube-linter-summary.py
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Check code secrets
      - name: Secret scanning
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          base: develop
          # Tweaking image injection to reference the image digest instead of the tag
          image: "ghcr.io/trufflesecurity/trufflehog@sha256"
          version: 52e67fef4d054ecff5c2ce4b4ae376626d1ef54aa0898b53cac19c25e92e14db # v3.97.9

      - name: Get kube-linter version
        id: kube-linter-version
        run: |
          KUBE_LINTER_VERSION=$( cat $KUBE_LINTER_VERSION_FILE_PATH)

          echo "version=${KUBE_LINTER_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Scan yaml files with kube-linter
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1.0.7
        id: kube-linter-action-scan
        with:
          directory: kubernetes
          version: ${{ steps.kube-linter-version.outputs.version }}
          format: sarif
          output-file: kube-linter-result.sarif.json

      - name: Upload lint result
        if: success() || steps.kube-linter-action-scan.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kube-linter-result-sarif
          path: kube-linter-result.sarif.json
          retention-days: 30
          if-no-files-found: error

      - name: Generate human readable output
        if: success() || steps.kube-linter-action-scan.outcome == 'failure'
        run : |
          python $SCRIPT_KUBE_LINTER_SUMMARY \
            --sarif-file kube-linter-result.sarif.json \
            --output-file kube-linter-result.md

          cat kube-linter-result.md >> "$GITHUB_STEP_SUMMARY"

  validate-governance-compliance:
    name: Validate Manifest Cluster Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      KYVERNO_CLI_VERSION: v1.19.1
      KYVERNO_SHA256: b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae
      MANIFESTS_FOLDER: kubernetes
      POLICIES_FOLDER: kubernetes/k8s-governance/kyverno/policies
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # needed for merge-base diff against main
          persist-credentials: false

      - name: Git diff from main
        id: diff
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/changed-manifests.txt"

          # Three-dot = diff against merge-base: only what THIS branch changed.
          # ACMR = added/copied/modified/renamed (deleted files can't be validated).
          git diff --name-only --diff-filter=ACMR \
            "origin/${BASE_REF}...HEAD" -- "${MANIFESTS_FOLDER}/" \
            | grep -E '\.ya?ml$' > "$out" || true

          # If policies themselves changed, re-validate everything.
          if git diff --name-only "origin/${BASE_REF}...HEAD" -- "${POLICIES_FOLDER}/" | grep -q .; then
            echo "Policies changed: validating all manifests"
            find "${MANIFESTS_FOLDER}" -type f \( -name '*.yaml' -o -name '*.yml' \) | sort > "$out"
          fi

          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "count=$(wc -l < "$out")" >> "$GITHUB_OUTPUT"

          echo "### Manifests to validate ($(wc -l < "$out"))" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- `/; s/$/`/' "$out" >> "$GITHUB_STEP_SUMMARY"

      - name: Install kyverno cli # manual as the GH-provided action seems deprecated
        if: steps.diff.outputs.count != '0'
        run: |
          set -euo pipefail
          
          # Tarball 
          tarball="kyverno-cli_${KYVERNO_CLI_VERSION}_linux_x86_64.tar.gz"
          echo Tarball : $tarball
          
          url=https://github.com/kyverno/kyverno/releases/download/${KYVERNO_CLI_VERSION}/${tarball}
          echo Url : $url

          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" $url
            
          echo "${KYVERNO_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check

          sudo tar -xzf "$RUNNER_TEMP/$tarball" -C "/usr/local/bin" kyverno
          
          rm $RUNNER_TEMP/$tarball

      - name: Check install
        if: steps.diff.outputs.count != '0'
        run: |
          kyverno version

      - name: Verify policies
        if: steps.diff.outputs.count != '0'
        shell: bash            # gives -eo pipefail so kyverno's exit code survives `tee`
        env:
          CHANGED_FILE: ${{ steps.diff.outputs.file }}
        run: |
          resources=()
          while IFS= read -r f; do
            resources+=(--resource "$f")
          done < "$CHANGED_FILE"

          set +e
          kyverno apply "${POLICIES_FOLDER}" "${resources[@]}" \
            --detailed-results --audit-warn 2>&1 | tee "$RUNNER_TEMP/kyverno.log"
          rc=${PIPESTATUS[0]}
          set -e

          {
            echo "### Kyverno result (exit code: $rc)"
            echo '```'
            cat "$RUNNER_TEMP/kyverno.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$rc"

      - name: Nothing to validate
        if: steps.diff.outputs.count == '0'
        run: echo "No manifest changes under ${MANIFESTS_FOLDER}/, skipping."