name: Build and Publish Airflow Image to Dev Registry

on:

  push:
    branches:
      - develop
    paths:
      - airflow/requirements.txt
      - airflow/Dockerfile

  workflow_dispatch:
    inputs:
      ref:
        description: "Branch from which the image will be built - default to develop"
        type: string
        default: develop
      commit-sha:
        description: "Commit sha of the specified ref - default to latest"
        required: false
      deployment-mode:
        description: "Deployment mode"
        type: choice
        options:
          - build
          - submit
          - deploy
        default: deploy
        required: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      security-events: write

    outputs:
      image-tag: ${{ github.sha }}
      image-digest: ${{ steps.push.outputs.digest }}
    defaults:
      run:
        working-directory: airflow
          
    env:
      IMAGE_REGISTRY: docker.io
      SBOM_TYPE: spdxjson
      IMAGE_REPOSITORY: ${{ vars.DOCKER_DEV_REPOSITORY }}
      IMAGE_TAG: ${{ inputs.commit-sha ||  github.sha }}
    steps:

      # ------------------------------------------------------------------
      # Setup and context
      # ------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit-sha || inputs.ref || github.ref_name }}


      - name: Set image metadata
        id: meta
        run: |
          IMAGE_NAME=$IMAGE_REPOSITORY:$IMAGE_TAG

          echo Image with repository : $IMAGE_REPOSITORY
          echo Image repository and tag : $IMAGE_NAME
  
          echo "image-name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      #  Install : Oras
      # ------------------------------------------------------------------

      - name: Prepare Cache or Retrieve Oras
        id: cache-oras
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/oras
          key: oras-linux-amd64

      - name: Install Oras
        if: steps.cache-oras.outputs.cache-hit != 'true'
        # official script available at: https://oras.land/docs/installation#linux
        run: |
          VERSION="1.3.4"
          curl -LO "https://github.com/oras-project/oras/releases/download/v${VERSION}/oras_${VERSION}_linux_amd64.tar.gz"
          mkdir -p oras-install/
          tar -zxf oras_${VERSION}_*.tar.gz -C oras-install/
          sudo mv oras-install/oras /usr/local/bin/
          rm -rf oras_${VERSION}_*.tar.gz oras-install/

      # ------------------------------------------------------------------
      # Install : Cosign
      # ------------------------------------------------------------------

      - name: Prepare Cache or Retrieve Cosign
        id: cache-cosign
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/cosign
          key: cosign-linux-amd64
          restore-keys: |
            cosign-linux-amd64

      - name : Install Cosign if not cached
        if: steps.cache-cosign.outputs.cache-hit != 'true' &&  steps.cache-cosign.outputs.cache-matched-key == ''
        uses : sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'
          install-dir: /usr/local/bin

      # ------------------------------------------------------------------
      #  Install: Syft
      # ------------------------------------------------------------------

      - name: Install Syft ( needs cosign to verify signature )
        run : |
          curl -sSfL https://get.anchore.io/syft | sudo sh -s -v -- -b /usr/local/bin

      # ------------------------------------------------------------------
      #  Install : Grype
      # ------------------------------------------------------------------

      - name: Prepare Cache or Retrieve Grype
        id: cache-grype
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/grype
          key: grype-linux-amd64

      - name: Install Grype
        if: steps.cache-grype.outputs.cache-hit != 'true' &&  steps.cache-grype.outputs.cache-matched-key == ''
        run: |
          curl -sSfL https://get.anchore.io/grype | sudo sh -s -v -- -b /usr/local/bin

      # ------------------------------------------------------------------
      #  Install : Grype ( vulnerability database )
      # ------------------------------------------------------------------

      - name: Restore Grype Vulnerability Database
        id: restore-grype-db
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #  6.1.0
        with:
          path: /home/runner/.cache/grype/db/6/
          key: grype-db-PLACEHOLDER
          restore-keys: |
            grype-db-

      # ------------------------------------------------------------------
      # Login to repository first  - fail fast before spending time on build/scan
      # ------------------------------------------------------------------

      - name: Login to Dockerhub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login with Oras
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: oras login $IMAGE_REGISTRY -u $USERNAME -p $PASSWORD
        # NOTE : not recommended as i couldn't succeed oras reusing docker credentials from previous step

      # ------------------------------------------------------------------
      # Build Image
      # ------------------------------------------------------------------

      - name: Build Docker image with basic OCI labels
        run: |
          docker buildx \
            build \
            --pull \
            --tag "${{ steps.meta.outputs.image-name }}" \
            --label "org.opencontainers.image.title=${{ github.event.repository.name }}" \
            --label "org.opencontainers.image.description=${{ github.event.repository.description }}" \
            --label "org.opencontainers.image.url=${{ github.event.repository.html_url }}" \
            --label "org.opencontainers.image.source=${{ github.event.repository.html_url }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${{ github.ref_name }}" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            .

      # ------------------------------------------------------------------
      # Generate SBOM
      # ------------------------------------------------------------------

      - name: Generate SBOM with Syft
        id: sbom
        env:
          IMAGE_NAME: ${{ steps.meta.outputs.image-name }}
        run: |
          SBOM_FILE=airflow-sbom.spdx.json

          syft $IMAGE_NAME \
            -o table \
            -o spdx-json=$SBOM_FILE

          echo "sbom-file=${SBOM_FILE}" >> "$GITHUB_OUTPUT"
          echo "sbom-type=spdxjson" >> "$GITHUB_OUTPUT"


      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: airflow/${{ steps.sbom.outputs.sbom-file }} # careful of default work dir
          retention-days: 30

      # ------------------------------------------------------------------
      # Scan vulnerabilities
      # ------------------------------------------------------------------

      - name: Run security scan against SBOM
        id: vuln
        env:
          SBOM_FILE: ${{ steps.sbom.outputs.sbom-file }}
        run: |
          grype $SBOM_FILE \
            -o sarif=vuln-airflow.sarif.json \
            -o json=vuln-airflow.json

      - name: Upload Grype security scan report artifact
        if: success() || steps.vuln.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vuln-airflow
          path: airflow/vuln-airflow.json
          retention-days: 30

      # ------------------------------------------------------------------
      # Push to Container Registry
      # ------------------------------------------------------------------

      - name: Push image and capture digest
        id: push
        env:
          IMAGE_NAME: ${{ steps.meta.outputs.image-name }}
        run: |
          docker push "${IMAGE_NAME}"

          DIGEST=$(docker buildx imagetools inspect \
            "${IMAGE_NAME}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')

          echo Computed Digest : $DIGEST

          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image-name-with-digest=$IMAGE_REPOSITORY@${DIGEST}" >> "$GITHUB_OUTPUT"

          echo "Published: $IMAGE_REPOSITORY@${DIGEST}"

      - name: Sign image
        env:
          IMAGE_NAME_WITH_DIGEST  : ${{ steps.push.outputs.image-name-with-digest }}
          COSIGN_PRIVATE_KEY      : ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD         : ${{ secrets.COSIGN_PRIVATE_KEY_PASSPHRASE }}
        run: |
          cosign sign \
            --key env://COSIGN_PRIVATE_KEY \
            -a "org.opencontainers.image.source=${{ github.event.repository.html_url }}" \
            -a "org.opencontainers.image.revision=${{ github.sha }}" \
            -a "dev.cosign.github.workflow=${{ github.workflow }}" \
            -a "dev.cosign.github.runner=${{ runner.os }}" \
            -a "dev.cosign.github.actor=${{ github.actor }}" \
            -a "dev.cosign.github.run_id=${{ github.run_id }}" \
            -a "dev.cosign.github.run_attempt=${{ github.run_attempt }}" \
            $IMAGE_NAME_WITH_DIGEST

      # ------------------------------------------------------------------
      # Attach SBOM to image
      # ------------------------------------------------------------------

      - name: Attach Signed SBOM to image
        env:
          IMAGE_NAME_WITH_DIGEST : ${{ steps.push.outputs.image-name-with-digest }}
          SBOM_FILE              : ${{ steps.sbom.outputs.sbom-file }}
          SBOM_TYPE              : ${{ steps.sbom.outputs.sbom-type }}
        run: |
          oras attach \
            --artifact-type sbom/$SBOM_TYPE \
            $IMAGE_REGISTRY/$IMAGE_NAME_WITH_DIGEST \
            $SBOM_FILE

      - name: Verify Attachment
        env:
          IMAGE_NAME_WITH_DIGEST: ${{ steps.push.outputs.image-name-with-digest }}
        run: oras discover $IMAGE_REGISTRY/$IMAGE_NAME_WITH_DIGEST

      # ------------------------------------------------------------------
      # Attest attached SBOM
      # ------------------------------------------------------------------

      - name: Attest SBOM
        env:
          IMAGE_NAME_WITH_DIGEST : ${{ steps.push.outputs.image-name-with-digest }}
          COSIGN_PRIVATE_KEY     : ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD        : ${{ secrets.COSIGN_PRIVATE_KEY_PASSPHRASE }}
          SBOM_FILE              : ${{ steps.sbom.outputs.sbom-file }}
          SBOM_TYPE              : ${{ steps.sbom.outputs.sbom-type }}
        run: |
          cosign attest \
            --key env://COSIGN_PRIVATE_KEY \
            --predicate $SBOM_FILE \
            --type $SBOM_TYPE \
            $IMAGE_NAME_WITH_DIGEST

      - name: Verify image signature (which also checks for annotations)
        env:
          IMAGE_NAME_WITH_DIGEST : ${{ steps.push.outputs.image-name-with-digest }}
          COSIGN_PUBLIC_KEY      : ${{ vars.COSIGN_PUBLIC_KEY }}
        run: |
          cosign verify \
            --key env://COSIGN_PUBLIC_KEY \
            $IMAGE_REGISTRY/$IMAGE_NAME_WITH_DIGEST

            echo "✓ Image signature verified"

  # ───────────────────────────────────────────────────
  # Deploy to development environment
  # ───────────────────────────────────────────────────
  deploy-dev-airflow:
    if: inputs.deployment-mode != 'build'
    needs:
      - build-and-publish
    uses: ./.github/workflows/submit-airflow-deployment.yml
    with:
      environment : dev
      image-name  : ${{ vars.DOCKER_DEV_REPOSITORY }}
      image-tag   : ${{ needs.build-and-publish.outputs.image-tag }}
      mode        : ${{ inputs.deployment-mode || 'deploy' }}
    secrets:
      GH_PAT_GITOPS_WF_DISPATCH: ${{ secrets.GH_PAT_GITOPS_WF_DISPATCH }}