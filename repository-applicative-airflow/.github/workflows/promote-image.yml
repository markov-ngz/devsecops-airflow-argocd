name: Promote Image

on:
  workflow_call:
    inputs:
      source-repository:
        description: "Source image repository"
        required: true
        type: string
      source-image-tag:
        description: "Docker image tag to promote"
        required: true
        type: string
      destination-repository:
        description: "Destination image repository"
        required: true
        type: string
      destination-image-tag:
        description: "Docker image tag to promote"
        required: true
        type: string
    secrets:
      registry-username:
        required: true
      registry-password:
        required: true

env:
  IMAGE_REGISTRY  : docker.io # assuming source and destination use the same registry
  SBOM_TYPE       : spdxjson
  COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}

jobs:
  promote-image:
    name: Promote Image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_REPOSITORY       : ${{ inputs.source-repository }}
      SOURCE_IMAGE_TAG        : ${{ inputs.source-image-tag }}
      DESTINATION_REPOSITORY  : ${{ inputs.destination-repository }}
      DESTINATION_IMAGE_TAG   : ${{ inputs.destination-image-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image references
        id: image-fqn
        run: |
          # OCI image references
          SOURCE_IMAGE_FQN="${IMAGE_REGISTRY}/${SOURCE_REPOSITORY}:${SOURCE_IMAGE_TAG}"
          DESTINATION_IMAGE_FQN="${IMAGE_REGISTRY}/${DESTINATION_REPOSITORY}:${DESTINATION_IMAGE_TAG}"

          echo "source=${SOURCE_IMAGE_FQN}" >> "$GITHUB_OUTPUT"
          echo "destination=${DESTINATION_IMAGE_FQN}" >> "$GITHUB_OUTPUT"

          echo "Image copy information:"
          echo "SOURCE      : ${SOURCE_IMAGE_FQN}"
          echo "DESTINATION : ${DESTINATION_IMAGE_FQN}"

      # ───────────────────────────────────────────────────
      # Install : Oras
      # ───────────────────────────────────────────────────

      - name: Prepare Cache or Retrieve Oras
        id: cache-oras
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/oras
          key: oras-linux-amd64

      - name: Install Oras
        if: steps.cache-oras.outputs.cache-hit != 'true'
        # Official script available at:
        # https://oras.land/docs/installation#linux
        run: |
          VERSION="1.3.4"
          curl -LO "https://github.com/oras-project/oras/releases/download/v${VERSION}/oras_${VERSION}_linux_amd64.tar.gz"
          mkdir -p oras-install/
          tar -zxf oras_${VERSION}_*.tar.gz -C oras-install/
          sudo mv oras-install/oras /usr/local/bin/
          rm -rf oras_${VERSION}_*.tar.gz oras-install/

      # ───────────────────────────────────────────────────
      # Install : Cosign
      # ───────────────────────────────────────────────────

      - name: Prepare Cache or Retrieve Cosign
        id: cache-cosign
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/cosign
          key: cosign-linux-amd64
          restore-keys: |
            cosign-linux-amd64

      - name: Install Cosign if not cached
        if: steps.cache-cosign.outputs.cache-hit != 'true' && steps.cache-cosign.outputs.cache-matched-key == ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'
          install-dir: /usr/local/bin

      # ───────────────────────────────────────────────────
      # Install : Grype
      # ───────────────────────────────────────────────────

      - name: Prepare Cache or Retrieve Grype
        id: cache-grype
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/grype
          key: grype-linux-amd64

      - name: Install Grype
        if: steps.cache-grype.outputs.cache-hit != 'true' && steps.cache-grype.outputs.cache-matched-key == ''
        run: |
          curl -sSfL https://get.anchore.io/grype | sudo sh -s -v -- -b /usr/local/bin

      # ───────────────────────────────────────────────────
      # Install : Grype vulnerability database
      # ───────────────────────────────────────────────────

      - name: Restore Grype Vulnerability Database
        id: restore-grype-db
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/grype/db/6/
          key: grype-db-PLACEHOLDER
          restore-keys: |
            grype-db-

      # ───────────────────────────────────────────────────
      # Login to registry
      #
      # Required permissions:
      #   source repository      : read
      #   destination repository : write
      # ───────────────────────────────────────────────────

      - name: Login to Dockerhub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password }}

      - name: Login with Oras
        env:
          USERNAME: ${{ secrets.registry-username }}
          PASSWORD: ${{ secrets.registry-password }}
        run: oras login "$IMAGE_REGISTRY" -u "$USERNAME" -p "$PASSWORD"
        # NOTE: Using explicit credentials because reusing Docker credentials with Oras was unsuccessful.

      # ───────────────────────────────────────────────────
      # Verify that the source image exists
      # ───────────────────────────────────────────────────

      - name: Check source image exists
        id: check-source
        run: |
          echo "Checking if image ${SOURCE_REPOSITORY}:${SOURCE_IMAGE_TAG} exists"

          TAGS=$(oras repo tags $IMAGE_REGISTRY/$SOURCE_REPOSITORY )

          echo "Available tags in source repository:"
          echo "$TAGS"

          if grep -qw "$SOURCE_IMAGE_TAG" <<< "$TAGS"; then
            echo "✅ Image tag $SOURCE_IMAGE_TAG exists in the source repository."
          else
            echo "❌ Image tag $SOURCE_IMAGE_TAG does NOT exist in the source repository."
            exit 1
          fi

      # ───────────────────────────────────────────────────
      # Inspect source image
      # ───────────────────────────────────────────────────

      - name: Inspect source image
        id: inspect-source
        env:
          IMAGE_FQN: ${{ steps.image-fqn.outputs.source }}
        run: |
          INSPECT_SOURCE_PAYLOAD=$(oras discover "$IMAGE_FQN" --format json)

          echo "Inspection of image ${IMAGE_FQN}:"
          echo "$INSPECT_SOURCE_PAYLOAD"
          
          # Compact to oneline json to pass it as step output
          ONELINE_INSPECT_SOURCE_PAYLOAD=$( echo $INSPECT_SOURCE_PAYLOAD | jq -c )

          echo "payload=${ONELINE_INSPECT_SOURCE_PAYLOAD}" >> "$GITHUB_OUTPUT"

      - name: Extract source image digest
        id: source-digest
        env:
          INSPECT_SOURCE_PAYLOAD: ${{ steps.inspect-source.outputs.payload }}
        run: |
          IMAGE_FQN_WITH_DIGEST=$(echo "$INSPECT_SOURCE_PAYLOAD" | jq -r '.reference')
          DIGEST=$(echo "$INSPECT_SOURCE_PAYLOAD" | jq -r '.digest')

          echo "image-fqn-with-digest=$IMAGE_FQN_WITH_DIGEST" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # ───────────────────────────────────────────────────
      # Verify source image signature
      # ───────────────────────────────────────────────────

      - name: Verify source image signature
        env:
          IMAGE_FQN: ${{ steps.image-fqn.outputs.source }}
        run: |
          echo "Verifying signature for ${IMAGE_FQN}"

          cosign verify \
            --key env://COSIGN_PUBLIC_KEY \
            "$IMAGE_FQN"

      # ───────────────────────────────────────────────────
      # Verify SBOM signature and download file
      # ───────────────────────────────────────────────────

      - name: Verify SBOM signature and download file
        id: source-sbom
        env:
          IMAGE_FQN: ${{ steps.image-fqn.outputs.source }}
          OUTPUT_FILE_PATH: sbom.spdx.json
        run: |
          cosign verify-attestation \
            --type "$SBOM_TYPE" \
            --key env://COSIGN_PUBLIC_KEY \
            "$IMAGE_FQN" | \
            jq -r '.payload | @base64d | fromjson | .predicate' \
            > "$OUTPUT_FILE_PATH"

          echo "file-path=${OUTPUT_FILE_PATH}" >> "$GITHUB_OUTPUT"

      # ───────────────────────────────────────────────────
      # Reproduce vulnerability scan from the signed SBOM
      # ───────────────────────────────────────────────────

      - name: Run security scan against source SBOM
        id: vuln
        env:
          SBOM_FILE_PATH: ${{ steps.source-sbom.outputs.file-path }}
        run: |
          grype "$SBOM_FILE_PATH" \
            -o sarif=vulnerability-scan.sarif.json \
            -o cyclonedx=vulnerability-scan.cdx.json

      - name: Upload CycloneDX security scan report
        if: success() || steps.vuln.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerability-scan-cyclonedx
          path: vulnerability-scan.cdx.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload SARIF security scan report
        if: success() || steps.vuln.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerability-scan-sarif
          path: vulnerability-scan.sarif.json
          retention-days: 30
          if-no-files-found: error

      # ───────────────────────────────────────────────────
      # Copy source image to destination
      # ───────────────────────────────────────────────────

      - name: Copy image to destination
        env:
          SOURCE_IMAGE_FQN: ${{ steps.image-fqn.outputs.source }}
          DESTINATION_IMAGE_FQN: ${{ steps.image-fqn.outputs.destination }}
        run: |
          oras cp \
            --recursive \
            "$SOURCE_IMAGE_FQN" \
            "$DESTINATION_IMAGE_FQN"

      - name: Summary
        env:
          SOURCE_IMAGE: ${{ steps.source-digest.outputs.image-fqn-with-digest }}
          DESTINATION_IMAGE: ${{ steps.image-fqn.outputs.destination }}
        run: |
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ### 📌 Image Copy Summary

          | **Property**       | **Value**                          |
          |--------------------|------------------------------------|
          | **Source**         | ${SOURCE_IMAGE}                    |
          | **Source tag**     | ${SOURCE_IMAGE_TAG}                |
          | **Destination**    | ${DESTINATION_IMAGE}               |
          | **Status**         | ✅ Successfully copied             |
          EOF
