name: DAG CI

on:
  pull_request:
    branches:
      - develop
    paths:
      - "airflow/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true                # cancel outdated runs on force-push

jobs:
  lint-dags:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "airflow/.python-version"
          cache: "pip"

      - name: Install linter and formatter
        run: pip install -r airflow/dev.requirements.txt

      - name: Ruff lint
        id: lint
        run: |
          ruff check ./airflow/ \
            --config ./airflow/ruff.toml \
            --output-format json > /tmp/ruff-lint.json || true

          python tools/ci/ruff_lint_summary.py /tmp/ruff-lint.json

      - name: Ruff format check
        if: success() || steps.lint.conclusion == 'failure'
        run: |
          ruff format ./airflow/ \
            --config ./airflow/ruff.toml \
            --check \
            --diff > /tmp/ruff-format.diff 2>/dev/null || true

          python tools/ci/ruff_format_summary.py /tmp/ruff-format.diff

      - name: Secret scanning
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          base: develop
          # Tweaking image injection to reference the image digest instead of the tag
          image: "ghcr.io/trufflesecurity/trufflehog@sha256"
          version: 52e67fef4d054ecff5c2ce4b4ae376626d1ef54aa0898b53cac19c25e92e14db # v3.97.9
  test-dags:
    name: Test DAGs
    runs-on: ubuntu-latest
    needs: lint-dags

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "airflow/.python-version"
          cache: "pip"

      - name: Install Airflow + dependencies
        env:
          # Derive the constraint URL from Python + Airflow versions
          PYTHON_VERSION: ${{ steps.setup-python.outputs.python-version }}
        run: |
          pip install --upgrade pip
          pip install apache-airflow==$(cat airflow/.airflow-version)
          pip install -r ./airflow/requirements.txt

      - name: Initialize Airflow DB (required by dag.test())
        env:
          AIRFLOW__CORE__UNIT_TEST_MODE: "True"         # avoids scheduler/webserver noise
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "sqlite:////tmp/airflow-test.db"
        run: airflow db migrate

      - name: Discover and run all DAG files
        env:
          AIRFLOW__CORE__UNIT_TEST_MODE: "True"
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "sqlite:////tmp/airflow-test.db"
          AIRFLOW__CORE__DAGS_FOLDER: "${{ github.workspace }}/airflow/dags"
        run: |
          DAG_FILES=$(find ./airflow/dags -name "*.py" -not -name "__init__.py")

          if [ -z "$DAG_FILES" ]; then
            echo "## ⚠️ DAG Test Results" >> $GITHUB_STEP_SUMMARY
            echo "No DAG files found in \`./airflow/dags\`." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # ── Counters ────────────────────────────────────────────────
          PASS=0
          FAIL=0
          HAS_FAILURE=0

          # ── Summary table header ─────────────────────────────────────
          {
            echo "## 🧪 DAG Test Results"
            echo ""
            echo "| Status | DAG File | Details |"
            echo "| ------ | -------- | ------- |"
          } >> $GITHUB_STEP_SUMMARY

          # ── Run each DAG ─────────────────────────────────────────────
          for dag_file in $DAG_FILES; do
            echo "▶ Testing: $dag_file"

            # Capture stdout+stderr; do NOT let a failure abort the loop
            OUTPUT=$(python "$dag_file" 2>&1) && STATUS=0 || STATUS=$?

            if [ $STATUS -eq 0 ]; then
              PASS=$((PASS + 1))
              echo "| ✅ Pass | \`$dag_file\` | — |" >> $GITHUB_STEP_SUMMARY
            else
              FAIL=$((FAIL + 1))
              HAS_FAILURE=1

              # Collapse the error output into a <details> block so the
              # table stays readable while the full trace is still there.
              {
                echo "| ❌ Fail | \`$dag_file\` | <details><summary>Show error</summary><pre>"
                echo "$OUTPUT"
                echo "</pre></details> |"
              } >> $GITHUB_STEP_SUMMARY
            fi
          done

          # ── Summary footer ───────────────────────────────────────────
          TOTAL=$((PASS + FAIL))
          {
            echo ""
            echo "**$PASS / $TOTAL** DAGs passed."
          } >> $GITHUB_STEP_SUMMARY

          # ── Fail the step if any DAG failed ──────────────────────────
          if [ $HAS_FAILURE -eq 1 ]; then
            echo "❌ $FAIL DAG(s) failed." >&2
            exit 1
          fi

          echo "✅ All $PASS DAGs passed."