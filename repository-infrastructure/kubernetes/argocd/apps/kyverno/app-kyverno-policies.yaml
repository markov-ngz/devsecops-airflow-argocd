apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1" # ensures kyverno is already up
spec:
  project: kyverno
  source:
    repoURL: 'git@github.com:markov-ngz/devsecops-lab-gitops.git'
    targetRevision: main
    path: 'kubernetes/kyverno/policies/'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: 'kyverno'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true