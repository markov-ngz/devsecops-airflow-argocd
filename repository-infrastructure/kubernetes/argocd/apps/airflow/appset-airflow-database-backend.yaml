apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: airflow-database-backend
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
          - env: pprd
          - env: prod

  template:
    metadata:
      name: '{{env}}-airflow-database-backend'
    spec:
      project: airflow-project

      source:
        repoURL: 'git@github.com:markov-ngz/devsecops-lab-gitops.git'
        targetRevision: main
        path: 'kubernetes/airflow/database-backend/overlays/{{env}}'

      destination:
        server: 'https://kubernetes.default.svc'
        namespace: '{{env}}-airflow-database-backend'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true