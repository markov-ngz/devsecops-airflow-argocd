# ArgocD Init step 0 : kubectl apply -f kubernetes/argocd/projects/appproject-argocd.yaml
# ArgocD Init step 1 : one time run
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-project
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: argocd
  source:
    repoURL: 'git@github.com:markov-ngz/devsecops-lab-gitops.git'
    targetRevision: main
    path: kubernetes/argocd/projects
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true